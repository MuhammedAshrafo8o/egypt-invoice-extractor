<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}دفتر{% endblock %} · دفتر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">د</span> دفتر</a>
    <nav class="topnav">
      <a href="/">العملاء</a>
    </nav>
    <div class="topbar-end">
      {% if not ai_enabled %}<span class="pill pill-warn" title="ضيف ANTHROPIC_API_KEY في ملف .env">قراءة الصور مقفولة</span>{% endif %}
      <span class="muted">{{ user.name }}</span>
      <form method="post" action="/logout"><button class="link-btn" type="submit">خروج</button></form>
    </div>
  </header>
  {% endif %}

  <main class="{% block main_class %}container{% endblock %}">
    {% for f in flashes %}
      <div class="flash flash-{{ f.kind }}" role="status">{{ f.text }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
