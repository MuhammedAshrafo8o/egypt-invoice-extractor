# Builds "DaftarSigner.exe" (the signing program accountants install next to their USB token),
# tests it against a software token, and publishes it as the latest GitHub release.
# Daftar links to: releases/latest/download/DaftarSigner.exe
name: Signing program (Windows)

on:
  push:
    branches: [main]
    paths: ["signer_agent/**", ".github/workflows/signer.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r signer_agent/requirements.txt

      - name: Build the .exe
        run: >
          pyinstaller --noconfirm --onefile --noconsole --name DaftarSigner
          --icon signer_agent/daftar.ico --add-data "signer_agent/daftar.ico;."
          --paths signer_agent signer_agent/daftar_signer.py

      - name: Software token (SoftHSM)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.5.0 -R disig/SoftHSM2-for-Windows -p "*.msi" -D softhsm
          $msi = (Get-ChildItem softhsm -Filter *.msi | Select-Object -First 1).FullName
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn" -Wait
          $dll = (Get-ChildItem C:\SoftHSM2 -Recurse -Filter softhsm2-x64.dll | Select-Object -First 1).FullName
          $util = (Get-ChildItem C:\SoftHSM2 -Recurse -Filter softhsm2-util.exe | Select-Object -First 1).FullName
          $conf = (Get-ChildItem C:\SoftHSM2 -Recurse -Filter softhsm2.conf | Select-Object -First 1).FullName
          "SOFTHSM_DLL=$dll" >> $env:GITHUB_ENV
          "SOFTHSM_UTIL=$util" >> $env:GITHUB_ENV
          "SOFTHSM2_CONF=$conf" >> $env:GITHUB_ENV
          "DAFTAR_PKCS11=$dll" >> $env:GITHUB_ENV
          Write-Host "dll=$dll util=$util conf=$conf"

      - name: Start the .exe, take a screenshot, test signing
        shell: pwsh
        continue-on-error: true
        run: |
          Start-Process dist\DaftarSigner.exe
          Start-Sleep -Seconds 8
          python signer_agent/ci/token_test.py
          Start-Sleep -Seconds 5
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("signer_agent/ci/screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signer-v1.0.${{ github.run_number }}
          name: برنامج التوقيع — دفتر 1.0.${{ github.run_number }}
          body: |
            DaftarSigner.exe — برنامج التوقيع بتاع دفتر. نزّله على الكمبيوتر اللي التوكن بيتركب فيه وافتحه.
          make_latest: true
          files: |
            dist/DaftarSigner.exe
            signer_agent/ci/report.txt
            signer_agent/ci/screenshot.png
