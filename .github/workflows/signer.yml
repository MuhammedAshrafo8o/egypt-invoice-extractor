# Builds "DaftarSigner.exe" (the signing program accountants install next to their USB token),
# tests it against a software token, and publishes it as the latest GitHub release.
# Daftar links to: releases/latest/download/DaftarSigner.exe
# Every step writes to ci-log.txt, which is attached to the release (or to a "failed" pre-release).
name: Signing program (Windows)

on:
  push:
    branches: [main]
    paths: ["signer_agent/**", ".github/workflows/signer.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        id: install
        continue-on-error: true
        run: |
          pip install -r signer_agent/requirements.txt *>&1 | Tee-Object -FilePath ci-log.txt -Append
          if ($LASTEXITCODE -ne 0) { "INSTALL FAILED" | Tee-Object ci-log.txt -Append; exit 1 }

      - name: Build the .exe
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name DaftarSigner `
            --icon signer_agent/daftar.ico --add-data "signer_agent/daftar.ico;." `
            --paths signer_agent signer_agent/daftar_signer.py *>&1 | Tee-Object -FilePath ci-log.txt -Append
          if (-not (Test-Path dist/DaftarSigner.exe)) { "BUILD FAILED" | Tee-Object ci-log.txt -Append; exit 1 }
          "BUILD OK: $((Get-Item dist/DaftarSigner.exe).Length) bytes" | Tee-Object ci-log.txt -Append

      - name: Software token (SoftHSM)
        id: softhsm
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R disig/SoftHSM2-for-Windows -p "*portable.zip" -D softhsm *>&1 | Tee-Object ci-log.txt -Append
          Expand-Archive (Get-ChildItem softhsm -Filter *.zip | Select-Object -First 1).FullName -DestinationPath softhsm\x
          $dll = (Get-ChildItem softhsm\x -Recurse -Filter softhsm2-x64.dll | Select-Object -First 1).FullName
          $util = (Get-ChildItem softhsm\x -Recurse -Filter softhsm2-util.exe | Select-Object -First 1).FullName
          $tokens = "$PWD\softhsm\tokens"
          New-Item -ItemType Directory -Force $tokens | Out-Null
          $conf = "$PWD\softhsm\softhsm2.conf"
          "directories.tokendir = $tokens`nobjectstore.backend = file`nlog.level = ERROR`n" | Set-Content -Encoding ascii $conf
          "dll=$dll util=$util conf=$conf" | Tee-Object ci-log.txt -Append
          if (-not $dll) { Get-ChildItem softhsm\x -Recurse | Select-Object FullName | Out-String | Tee-Object ci-log.txt -Append; exit 1 }
          "SOFTHSM_DLL=$dll" >> $env:GITHUB_ENV
          "SOFTHSM_UTIL=$util" >> $env:GITHUB_ENV
          "SOFTHSM2_CONF=$conf" >> $env:GITHUB_ENV
          "DAFTAR_PKCS11=$dll" >> $env:GITHUB_ENV

      - name: Run the .exe, test signing, screenshot
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          if ($env:SOFTHSM_DLL) {
            python signer_agent/ci/token_test.py --setup *>&1 | Tee-Object -FilePath ci-log.txt -Append
            python signer_agent/ci/token_test.py *>&1 | Tee-Object -FilePath ci-log.txt -Append }
          Start-Process dist\DaftarSigner.exe
          Start-Sleep -Seconds 12
          try { $r = Invoke-WebRequest http://127.0.0.1:47321/status -UseBasicParsing -Headers @{Origin="https://daftar-blue.vercel.app"}
                "EXE STATUS: " + [System.Text.Encoding]::UTF8.GetString($r.RawContentStream.ToArray()) | Tee-Object ci-log.txt -Append }
          catch { "EXE STATUS FAILED: $_" | Tee-Object ci-log.txt -Append }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png) }
          Start-Sleep -Seconds 3
          Shot "screenshot.png"
          # ask the exe to sign: its PIN box opens (nobody types it here; just to see it)
          try {
            $status = [System.Text.Encoding]::UTF8.GetString($r.RawContentStream.ToArray()) | ConvertFrom-Json
            $cert = $status.certificates[0].id
            if ($cert) {
              $body = @{ cert = $cert; to_sign = "aGVsbG8="; summary = "فاتورة INV-0001 — شركة الدلتا للتجارة — الإجمالي 11,400.00 جنيه" } | ConvertTo-Json
              Start-Job -ScriptBlock { param($b) Invoke-WebRequest http://127.0.0.1:47321/sign -Method Post -UseBasicParsing `
                -Headers @{Origin="https://daftar-blue.vercel.app"} -ContentType "application/json; charset=utf-8" `
                -Body ([System.Text.Encoding]::UTF8.GetBytes($b)) } -ArgumentList $body | Out-Null
              Start-Sleep -Seconds 5
              Shot "pin.png"
              "pin screenshot saved" | Tee-Object ci-log.txt -Append } }
          catch { "PIN SHOT FAILED: $_" | Tee-Object ci-log.txt -Append }
          Start-Sleep -Seconds 3

      - name: Publish
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signer-v1.0.${{ github.run_number }}
          name: برنامج التوقيع — دفتر 1.0.${{ github.run_number }}
          body: |
            DaftarSigner.exe — برنامج التوقيع بتاع دفتر. نزّله على الكمبيوتر اللي التوكن بيتركب فيه وافتحه.
          make_latest: true
          files: |
            dist/DaftarSigner.exe
            ci-log.txt
            screenshot.png
            pin.png
            signer_agent/ci/report.txt

      - name: Publish the log of a failed build
        if: steps.build.outcome != 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signer-failed-${{ github.run_number }}
          name: failed build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: ci-log.txt
