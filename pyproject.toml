[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egypt-invoice-extractor"
version = "0.1.0"
description = "Extract and validate data from Egyptian invoices (PDF and images) for VAT returns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pdfplumber>=0.11",
  "pypdfium2>=4.0",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.optional-dependencies]
samples = ["reportlab>=4.0"]

[project.scripts]
invoice-extractor = "invoice_extractor.cli:main"

[tool.setuptools.packages.find]
include = ["invoice_extractor*"]
